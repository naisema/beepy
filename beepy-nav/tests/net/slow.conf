# DESIGN.md 7.8's fixture. A fetcher that takes as long as a real one does --
# 1.4 s was measured against Valhalla from the device -- without touching the
# network, which is the entire reason fetch_cmd is a config string.
#
# The 8 Hz claim is only testable against a command that is genuinely slow. A
# `cat` returns before the next frame and would prove nothing at all.
fetch_cmd = sh -c "sleep 1.5; printf SLOWBYTES"
