# online.conf with a fetcher that KEEPS THE REQUEST as well as answering it.
#
# The body is the only place use_tolls exists -- it is composed, written to a
# temp file, and named to the child in $BEEPY_BODY (netfetch.c:150). Nothing
# downstream reflects it, so a costing_options that was malformed, or attached
# to the wrong mode, would produce a route that parsed perfectly and a gate that
# noticed nothing. Copying the body out is the only way to assert on it without
# a network.
#
# mode = bike is the whole difference between this pair.
place = HOME 13.8851,100.3785
place = WORK 13.7338,100.5601

router_url = http://example.invalid/route
router_type = valhalla
mode = bike

fetch_cmd = sh -c 'cp $BEEPY_BODY beepy-nav/tests/replay/req-bike.json; cat beepy-nav/tests/net/valhalla-bike.json'
