# online.conf with a fetcher that NEVER answers, which is what makes FETCHING and
# then TIMED OUT two states a test can photograph without racing the wall clock.
#
# A fetcher with a finite sleep cannot do that. Under --pace the ride clock lags
# the wall clock by however long the loop spends rendering and writing dumps, so
# the ride second at which a 1.5 s fetch lands moves with the machine's load --
# and a dump scheduled at a fixed ride second lands on either side of it. This
# one is still running at every ride second before the deadline and has failed at
# every ride second after it, both by arithmetic rather than by luck.
#
# It is also the failure a rider actually meets: a server that accepts the
# connection and then says nothing (7.8).
place = HOME 13.8851,100.3785
place = WORK 13.7338,100.5601
router_url = http://example.invalid/route
router_type = valhalla
fetch_cmd = sleep 60
