# online.conf with a router that says the route uses a toll road.
#
# Same rider, same two places, same seam, same 177-point route -- the ONLY
# change is `"has_toll":true` in the reply. That is what makes the pair an
# assertion rather than a screenshot: the two runs differ in one JSON literal,
# so any pixel that differs between the frames they produce is that literal
# arriving on the panel, and nothing else.
#
# The fixture is a sed of the committed valhalla-bike.json for exactly that
# reason. Capturing a second real reply would have changed the geometry, the
# cue count and the distance along with the flag, and then a badge that never
# drew would still have produced two different frames.
place = HOME 13.8851,100.3785
place = WORK 13.7338,100.5601

router_url = http://example.invalid/route
router_type = valhalla

fetch_cmd = cat beepy-nav/tests/net/valhalla-toll.json
