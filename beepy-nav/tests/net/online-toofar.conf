# DESIGN.md 7.10's fixture: online.conf with a "router" that refuses on DISTANCE.
#
# Same rider, same two places, same seam -- the only change is which committed
# body `cat` hands back. bad-toofar.json is the REAL 129-byte refusal FOSSGIS
# Valhalla sent when the rider asked for a destination 203 km away against a
# bicycle cap of 200 km (see tools/mknetfix.py on why it is captured and not
# generated). Its error_code 154 is the API contract TOO FAR is matched on, so
# this test exercises the same bytes the device did.
#
# THE FETCHER ANSWERS THE SAME WAY BOTH TIMES, and that is what makes the test
# about the REQUEST rather than about the reply. ENTER once is refused; ENTER
# again must ask for the same destination as a CAR, and the only evidence of that
# is the costing in the second request. A `cat` cannot know which was asked, so a
# build that ignored the offer and re-sent the bicycle would produce a byte-
# identical second refusal -- which is exactly why net_start() prints the mode.
#
# mode is NOT set: bike is the default and the offer is armed only from bike, so
# stating it would hide a build whose default had drifted.
place = HOME 13.8851,100.3785
place = WORK 13.7338,100.5601
router_url = http://example.invalid/route
router_type = valhalla
fetch_cmd = cat beepy-nav/tests/net/bad-toofar.json
