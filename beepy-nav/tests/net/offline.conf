# The same rider and the same two places with NO router configured, which is the
# default state of this program and therefore the one a rider meets first.
#
# fetch_cmd is deliberately present and deliberately never run: with no
# router_url there is nothing that could have answered, and the page must say so
# rather than start a fetcher against an empty URL. A version that checked only
# fetch_cmd would pass this test by running `cat` and inventing a route to a
# place the rider cannot reach.
place = HOME 13.8851,100.3785
place = WORK 13.7338,100.5601
router_type = valhalla
fetch_cmd = cat beepy-nav/tests/net/valhalla-bike.json
