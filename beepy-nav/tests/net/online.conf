# DESIGN.md 7.10's fixture: a rider in Asok, a saved place 26 km outside the
# Asok pack, and a "router" that is a `cat`.
#
# The two places are saved.conf's, unchanged and deliberately so -- WORK is
# inside the pack and HOME is 26 km outside it, which is the whole experiment.
# ENTER on WORK must be answered by the pack in 0.1 ms and never reach the
# network; ENTER on HOME cannot be answered by the pack at all, and is the one
# case that earns 1.4 seconds and a connection.
place = HOME 13.8851,100.3785
place = WORK 13.7338,100.5601

# Never contacted. It is here because an EMPTY router_url is a different test
# (offline.conf) -- with one set, the request is composed, the body is written
# and $BEEPY_URL is exported, and only the fetcher itself is a fiction.
router_url = http://example.invalid/route
router_type = valhalla

# The seam, and the reason no test here touches the network. `cat` answers
# before the next frame, which is what makes this the fixture for the whole
# path; slow.conf's variant is what makes FETCHING visible.
fetch_cmd = cat beepy-nav/tests/net/valhalla-bike.json
